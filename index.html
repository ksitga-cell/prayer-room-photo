<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>祈禱室清潔照片上傳</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    #userInfo {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 8px;
    }
    .field {
      margin-bottom: 16px;
    }
    label.title {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 15px;
    }
    .radio-group {
      display: flex;
      gap: 12px;
    }
    .radio-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 15px;
      transition: all 0.15s ease;
    }
    .radio-option:has(input:checked) {
      border-color: #06c755;
      background: #ecfdf3;
      font-weight: 600;
    }
    .photo-actions {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-clear {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    #previewGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    #previewGrid img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    #submitBtn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #06c755;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #submitBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>祈禱室清潔照片上傳</h3>
    <div id="userInfo">正在連線 LINE...</div>

    <div class="field">
      <label class="title">選擇祈禱室（必填）</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="roomType" value="男祈禱室" />
          <span>男祈禱室</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="roomType" value="女祈禱室" />
          <span>女祈禱室</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="title">選擇或拍攝照片（可多次累加，必填）</label>
      <input id="photoInput" type="file" accept="image/*" multiple style="display:none" />
      <div class="photo-actions">
        <button type="button" id="addPhotoBtn" class="btn-secondary">+ 新增照片</button>
        <button type="button" id="clearPhotoBtn" class="btn-clear" style="display:none">清空重選</button>
      </div>
      <div id="previewGrid"></div>
    </div>

    <div class="field">
      <label class="title" for="noteInput">備註（選填）</label>
      <input id="noteInput" type="text" placeholder="例如：地板清潔、垃圾清運完成" />
    </div>

    <button id="submitBtn" disabled>送出上傳</button>
    <div id="status"></div>
  </div>

  <script>
    const LIFF_ID = '2012273086-W7Fdk3TT';
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzI_55D28bG0QPD6CbkfBobVEtuaNc1NhHTGO7NFzTrDJpmK3QiU0DWN2qJRgBuBhoHrA/exec';

    let profile = { userId: '', displayName: '' };
    let compressedImages = [];

    async function initLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      profile = await liff.getProfile();
      document.getElementById('userInfo').textContent = `LINE 暱稱：${profile.displayName}`;
      document.getElementById('submitBtn').disabled = false;
    }

    function getSelectedRoom() {
      const checked = document.querySelector('input[name="roomType"]:checked');
      return checked ? checked.value : '';
    }

    function compressImage(file, maxWidth = 1600, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      const grid = document.getElementById('previewGrid');
      const clearBtn = document.getElementById('clearPhotoBtn');
      grid.innerHTML = '';
      compressedImages.forEach((src, idx) => {
        const imgEl = document.createElement('img');
        imgEl.src = src;
        imgEl.alt = `預覽第 ${idx + 1} 張`;
        grid.appendChild(imgEl);
      });
      clearBtn.style.display = compressedImages.length > 0 ? 'inline-block' : 'none';
    }

    document.getElementById('addPhotoBtn').addEventListener('click', () => {
      const input = document.getElementById('photoInput');
      input.value = '';
      input.click();
    });

    document.getElementById('clearPhotoBtn').addEventListener('click', () => {
      compressedImages = [];
      renderPreviews();
      document.getElementById('status').textContent = '';
    });

    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      const status = document.getElementById('status');
      if (files.length === 0) return;

      status.textContent = `正在處理新增的 ${files.length} 張照片...`;
      try {
        for (let i = 0; i < files.length; i++) {
          const base64 = await compressImage(files[i]);
          compressedImages.push(base64);
        }
        renderPreviews();
        status.textContent = `目前已累積 ${compressedImages.length} 張照片（可繼續按「+ 新增照片」）。`;
      } catch (err) {
        status.textContent = '照片處理失敗：' + err.message;
      }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const roomType = getSelectedRoom();
      const note = document.getElementById('noteInput').value.trim();

      if (!roomType) {
        status.textContent = '請先選擇「男祈禱室」或「女祈禱室」。';
        return;
      }
      if (compressedImages.length === 0) {
        status.textContent = '請先選擇至少一張照片。';
        return;
      }

      btn.disabled = true;
      status.textContent = '';

      let successCount = 0;
      let lastPerson = profile.displayName;

      try {
        for (let i = 0; i < compressedImages.length; i++) {
          btn.textContent = `上傳中 (${i + 1}/${compressedImages.length})...`;
          status.textContent = `正在上傳第 ${i + 1} / ${compressedImages.length} 張照片...`;

          const res = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              roomType,
              userId: profile.userId,
              userName: profile.displayName,
              note,
              photoIndex: i + 1,
              photoTotal: compressedImages.length,
              imageBase64: compressedImages[i]
            })
          });

          const result = await res.json();
          if (!result.success) {
            throw new Error(result.message || `第 ${i + 1} 張上傳失敗`);
          }
          successCount++;
          if (result.realName) lastPerson = result.realName;
        }

        status.textContent = `${roomType} 共 ${successCount} 張照片已記錄（人員：${lastPerson}）`;
        compressedImages = [];
        renderPreviews();
        document.getElementById('noteInput').value = '';
        document.querySelectorAll('input[name="roomType"]').forEach((el) => {
          el.checked = false;
        });
      } catch (err) {
        status.textContent = `已成功上傳 ${successCount} / ${compressedImages.length} 張，但發生錯誤：${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '送出上傳';
      }
    });

    initLiff().catch((err) => {
      document.getElementById('userInfo').textContent = 'LIFF 初始化失敗：' + err.message;
    });
  </script>
</body>
</html>
